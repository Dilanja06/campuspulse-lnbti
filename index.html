<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusPulse — LNBTI Club & Event Portal</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <script>
    // Initial anti-flicker dark mode script
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
  globalThis.tailwind = globalThis.tailwind || {};
  globalThis.tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          'success': '#15803D',
          'on-success': '#FFFFFF',
          'success-container': '#DCFCE7',
          'on-success-container': '#14532D',
          'warning': '#B45309',
          'on-warning': '#FFFFFF',
          'warning-container': '#FEF3C7',
          'on-warning-container': '#78350F',
          'info': '#1D4ED8',
          'on-info': '#FFFFFF',
          'info-container': '#DBEAFE',
          'on-info-container': '#1E3A8A',
          /* LNBTI Dynamic Adaptive Theme Colors (CSS Variables) */
          'light-primary': 'var(--color-primary, #E6292D)',
          'light-on-primary': 'var(--color-on-primary, #FFFFFF)',
          'light-primary-container': 'var(--color-primary-container, #C41D21)',
          'light-on-primary-container': 'var(--color-on-primary-container, #FFDAD6)',
          'light-secondary': 'var(--color-secondary, #653A8F)',
          'light-on-secondary': 'var(--color-on-secondary, #FFFFFF)',
          'light-secondary-container': 'var(--color-secondary-container, #F3E8FF)',
          'light-on-secondary-container': 'var(--color-on-secondary-container, #2E004E)',
          'light-tertiary': '#401800',
          'light-on-tertiary': '#FFFFFF',
          'light-tertiary-container': '#FFDBCA',
          'light-on-tertiary-container': '#532200',
          'light-error': '#BA1A1A',
          'light-on-error': '#FFFFFF',
          'light-error-container': '#FFDAD6',
          'light-on-error-container': '#93000A',
          'light-background': 'var(--color-surface, #FAF9FC)',
          'light-on-background': 'var(--color-on-surface, #1A1C1E)',
          'light-surface': 'var(--color-surface, #FAF9FC)',
          'light-surface-dim': 'var(--color-surface-dim, #DAD9DD)',
          'light-surface-bright': 'var(--color-surface-bright, #FAF9FC)',
          'light-surface-container-lowest': 'var(--color-surface-container-lowest, #FFFFFF)',
          'light-surface-container-low': 'var(--color-surface-container-low, #F7F5F9)',
          'light-surface-container': 'var(--color-surface-container, #EFECEF)',
          'light-surface-container-high': 'var(--color-surface-container-high, #E9E5EA)',
          'light-surface-container-highest': 'var(--color-surface-container-highest, #E3DFE4)',
          'light-on-surface': 'var(--color-on-surface, #1A1C1E)',
          'light-surface-variant': 'var(--color-surface-variant, #E5E1E6)',
          'light-on-surface-variant': 'var(--color-on-surface-variant, #43474E)',
          'light-outline': 'var(--color-outline, #74777F)',
          'light-outline-variant': 'var(--color-outline-variant, #C4C6CF)',
          'light-inverse-surface': 'var(--color-on-surface, #2F3033)',
          'light-inverse-on-surface': 'var(--color-surface, #F1F0F4)',
          'light-inverse-primary': '#FFB4AB',
        },
        borderRadius: {
          'sm': '4px',
          'DEFAULT': '8px',
          'md': '12px',
          'lg': '16px',
          'xl': '24px',
          'full': '9999px',
        },
        spacing: {
          'xs': '4px',
          'sm': '8px',
          'md': '16px',
          'lg': '24px',
          'xl': '32px',
          '2xl': '48px',
        },
        fontFamily: {
          'display': ['"Wix Madefor Display"', 'sans-serif'],
          'headline': ['"Wix Madefor Display"', 'sans-serif'],
          'title': ['"Instrument Sans"', 'sans-serif'],
          'body': ['"Instrument Sans"', 'sans-serif'],
          'label': ['"Instrument Sans"', 'sans-serif'],
          'mono': ['"Source Code Pro"', 'monospace'],
        },
        fontSize: {
          'display-lg': ['40px', { lineHeight: '48px', letterSpacing: '-0.5px', fontWeight: '700' }],
          'display-lg-mobile': ['28px', { lineHeight: '36px', letterSpacing: '-0.25px', fontWeight: '700' }],
          'headline-lg': ['32px', { lineHeight: '40px', letterSpacing: '-0.25px', fontWeight: '700' }],
          'headline-md': ['24px', { lineHeight: '32px', letterSpacing: '-0.15px', fontWeight: '600' }],
          'headline-sm': ['20px', { lineHeight: '28px', letterSpacing: '0px', fontWeight: '600' }],
          'title-lg': ['18px', { lineHeight: '26px', letterSpacing: '0px', fontWeight: '600' }],
          'title-md': ['16px', { lineHeight: '24px', letterSpacing: '0px', fontWeight: '600' }],
          'body-lg': ['16px', { lineHeight: '24px', letterSpacing: '0px', fontWeight: '400' }],
          'body-md': ['14px', { lineHeight: '20px', letterSpacing: '0px', fontWeight: '400' }],
          'label-lg': ['14px', { lineHeight: '20px', letterSpacing: '0.1px', fontWeight: '600' }],
          'label-md': ['12px', { lineHeight: '16px', letterSpacing: '0.2px', fontWeight: '600' }],
          'label-sm': ['11px', { lineHeight: '16px', letterSpacing: '0.3px', fontWeight: '600' }],
          'mono-md': ['13px', { lineHeight: '18px', letterSpacing: '0px', fontWeight: '500' }],
        },
        transitionDuration: {
          'state-change': '150ms',
          'surface-enter': '250ms',
          'surface-exit': '150ms',
        },
      },
    },
  };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Source+Code+Pro:wght@500&family=Wix+Madefor+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet" />
  <style>
    .material-symbols-outlined, .material-symbols-rounded, .material-symbols-sharp, .material-icons {
      display: inline-block; width: 1em; height: 1em; line-height: 1 !important; box-sizing: content-box; overflow: hidden; white-space: nowrap; direction: ltr; vertical-align: middle;
    }

    /* Light Theme Tokens */
    :root {
      --color-primary: #E6292D;
      --color-on-primary: #FFFFFF;
      --color-primary-container: #C41D21;
      --color-on-primary-container: #FFDAD6;
      --color-secondary: #653A8F;
      --color-on-secondary: #FFFFFF;
      --color-secondary-container: #F3E8FF;
      --color-on-secondary-container: #2E004E;
      --color-surface: #FAF9FC;
      --color-surface-dim: #DAD9DD;
      --color-surface-bright: #FAF9FC;
      --color-surface-container-lowest: #FFFFFF;
      --color-surface-container-low: #F7F5F9;
      --color-surface-container: #EFECEF;
      --color-surface-container-high: #E9E5EA;
      --color-surface-container-highest: #E3DFE4;
      --color-on-surface: #1A1C1E;
      --color-surface-variant: #E5E1E6;
      --color-on-surface-variant: #43474E;
      --color-outline: #74777F;
      --color-outline-variant: #E4E1E6;
    }

    /* Dark Theme Tokens (LNBTI Crimson & Royal Purple on Charcoal) */
    html.dark, :root.dark {
      --color-primary: #FF4D52;
      --color-on-primary: #5C0006;
      --color-primary-container: #990B12;
      --color-on-primary-container: #FFDAD6;
      --color-secondary: #C092F6;
      --color-on-secondary: #3B0764;
      --color-secondary-container: #48196E;
      --color-on-secondary-container: #F3E8FF;
      --color-surface: #111215;
      --color-surface-dim: #111215;
      --color-surface-bright: #323338;
      --color-surface-container-lowest: #18191D;
      --color-surface-container-low: #1F2025;
      --color-surface-container: #26272D;
      --color-surface-container-high: #2E3036;
      --color-surface-container-highest: #383A41;
      --color-on-surface: #E3E2E6;
      --color-surface-variant: #3B3C42;
      --color-on-surface-variant: #C4C6CF;
      --color-outline: #8E9199;
      --color-outline-variant: #343538;
    }

    html.dark {
      color-scheme: dark;
      background-color: #111215;
      color: #E3E2E6;
    }

    html.dark input, 
    html.dark select, 
    html.dark textarea {
      background-color: var(--color-surface-container-lowest) !important;
      color: var(--color-on-surface) !important;
      border-color: var(--color-outline-variant) !important;
    }

    html.dark input::placeholder, 
    html.dark textarea::placeholder {
      color: #8E9199 !important;
    }
  </style>
</head>
<body class="bg-light-surface text-light-on-surface font-body antialiased">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
